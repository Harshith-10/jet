[package]
name = "jet-pack"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
console = "0.15"
flate2 = "1"
futures = "0.3"
indicatif = "0.17"
redis = "1.0"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "stream",
] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tar = "0.4"
thiserror = "2"
xz2 = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
