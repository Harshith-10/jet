[package]
name = "jet-server"
version = "0.1.0"
edition = "2024"

[dependencies]
apalis = "0.7.4"
apalis-redis = "0.7.4"
axum = "0.8.8"
hakoniwa = { version = "1.3.0", features = ["cgroups", "landlock", "seccomp"] }
jet-core = { path = "../../crates/jet-core" }
jet-pack = { path = "../../crates/jet-pack" }
libc = "0.2.182"
redis = { version = "0.32.7", features = ["tokio-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }

[dev-dependencies]
mini-redis = "0.4.1"
tempfile = "3.25.0"
