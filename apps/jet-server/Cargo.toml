[package]
name = "jet-server"
version = "0.1.0"
edition = "2024"

[dependencies]
apalis = { version = "1.0.0-rc.4", features = ["limit"] }
apalis-redis = "1.0.0-rc.4"
axum = "0.8.8"
deadpool-redis = { version = "0.23", features = ["rt_tokio_1"] }
hex = "0.4"
hakoniwa = { version = "1.3.0", features = ["cgroups", "landlock", "seccomp"] }
hmac = "0.12"
jet-core = { path = "../../crates/jet-core" }
jet-pack = { path = "../../crates/jet-pack" }
libc = "0.2.182"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5"
tower_governor = { version = "0.8", features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.21.0", features = ["v4", "serde"] }

[dev-dependencies]
mini-redis = "0.4.1"
tempfile = "3.25.0"
